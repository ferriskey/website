## Common image tag applied to all apps
imageTag: sha-118ef46

## Ingress shared config (used only when an app's ingress.enabled is true)
ingress:
  className: traefik
  clusterIssuer: letsencrypt-internal

## Gateway API shared config
## Points at the pre-existing `ferris-gateway` (Envoy Gateway) in the `default`
## namespace, which terminates TLS for *.ferriskey.rs / ferriskey.rs.
gateway:
  enabled: true
  name: ferris-gateway
  namespace: default

apps:
  website:
    enabled: true
    image: ghcr.io/ferriskey/ferriskey-website
    replicas: 1
    containerPort: 8080
    host: ferriskey.rs
    service:
      type: ClusterIP
      port: 80
    ingress:
      enabled: false
      annotations: {}
    route:
      enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

  docs:
    enabled: true
    image: ghcr.io/ferriskey/ferriskey-docs
    replicas: 1
    containerPort: 8080
    host: docs.ferriskey.rs
    service:
      type: ClusterIP
      port: 80
    ingress:
      enabled: false
      annotations: {}
    route:
      enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

  blog:
    enabled: true
    image: ghcr.io/ferriskey/ferriskey-blog
    replicas: 1
    containerPort: 8080
    host: blog.ferriskey.rs
    service:
      type: ClusterIP
      port: 80
    ingress:
      enabled: false
      annotations: {}
    route:
      enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
