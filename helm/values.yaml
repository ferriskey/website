## Common image tag applied to all apps
imageTag: sha-671ab36

## Ingress shared config (used only when an app's ingress.enabled is true)
ingress:
  className: traefik
  clusterIssuer: letsencrypt-internal

## Gateway API shared config
## Routes attach to `ferris-gateway` (Envoy Gateway) in the `default` namespace.
## With `create: true` the chart owns that Gateway and writes one HTTPS listener
## per routed host; cert-manager issues each certificate from `clusterIssuer`.
## Set `create: false` to attach to a Gateway managed elsewhere.
gateway:
  enabled: true
  create: true
  name: ferris-gateway
  namespace: default
  className: eg
  clusterIssuer: letsencrypt

apps:
  website:
    enabled: true
    image: ghcr.io/ferriskey/ferriskey-website
    replicas: 1
    containerPort: 8080
    host: ferriskey.rs
    service:
      type: ClusterIP
      port: 80
    ingress:
      enabled: false
      annotations: {}
    route:
      enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

  docs:
    enabled: true
    image: ghcr.io/ferriskey/ferriskey-docs
    replicas: 1
    containerPort: 8080
    host: docs.ferriskey.rs
    service:
      type: ClusterIP
      port: 80
    ingress:
      enabled: false
      annotations: {}
    route:
      enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

  blog:
    enabled: true
    image: ghcr.io/ferriskey/ferriskey-blog
    replicas: 1
    containerPort: 8080
    host: blog.ferriskey.rs
    service:
      type: ClusterIP
      port: 80
    ingress:
      enabled: false
      annotations: {}
    route:
      enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
