## Common image tag applied to all apps
imageTag: sha-c47ed86

## Ingress shared config
ingress:
  className: nginx
  clusterIssuer: letsencrypt-prod

## Gateway API disabled in this values file - legacy Ingress-only setup
gateway:
  enabled: false
  name: ferris-gateway
  namespace: default

apps:
  website:
    enabled: true
    image: ghcr.io/ferriskey/ferriskey-website
    replicas: 1
    containerPort: 8080
    host: ferriskey.rs
    service:
      type: ClusterIP
      port: 80
    ingress:
      enabled: true
      annotations: {}
    route:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

  docs:
    enabled: true
    image: ghcr.io/ferriskey/ferriskey-docs
    replicas: 1
    containerPort: 8080
    host: docs.ferriskey.rs
    service:
      type: ClusterIP
      port: 80
    ingress:
      enabled: true
      annotations: {}
    route:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

  blog:
    enabled: true
    image: ghcr.io/ferriskey/ferriskey-blog
    replicas: 1
    containerPort: 8080
    host: blog.ferriskey.rs
    service:
      type: ClusterIP
      port: 80
    ingress:
      enabled: true
      annotations: {}
    route:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
